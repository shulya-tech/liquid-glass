name: Publish to npmjs

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'types/**'
      - 'tables/**'
      - 'build.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (with OIDC Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm CLI for OIDC support
        run: npm install -g npm@latest

      - name: Check if local version is newer than npm
        id: check-version
        run: |
          node -e '
            const cp = require("child_process");
            const fs = require("fs");
            const local = require("./package.json").version;
            let latest = "0.0.0";
            try {
              latest = cp.execSync("npm view @shulya/liquid-glass version", { encoding: "utf8" }).trim();
            } catch (e) {}

            function parse(v) {
              return v.split("-")[0].split(".").map(Number);
            }
            function isGreater(a, b) {
              const pa = parse(a), pb = parse(b);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] || 0) > (pb[i] || 0)) return true;
                if ((pa[i] || 0) < (pb[i] || 0)) return false;
              }
              return false;
            }

            const shouldPublish = isGreater(local, latest);
            if (shouldPublish) {
              console.log(`Local version (${local}) is newer than npm (${latest}) -> Publishing!`);
            } else {
              console.log(`Local version (${local}) is same or older than npm (${latest}) -> Skipping publish.`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${shouldPublish}\n`);
          '

      - name: Build package
        if: steps.check-version.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish to npmjs via OIDC Trusted Publisher
        if: steps.check-version.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
