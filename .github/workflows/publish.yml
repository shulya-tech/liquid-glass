name: Publish to npmjs

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (with OIDC Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm CLI for OIDC support
        run: npm install -g npm@latest

      - name: Build package
        run: npm run build

      - name: Check and synchronize version with npm
        id: versioning
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          EXISTING=$(npm view "@shulya/liquid-glass@$LOCAL_VER" version 2>/dev/null || echo "")
          
          if [ -n "$EXISTING" ]; then
            LATEST_VER=$(npm view @shulya/liquid-glass version 2>/dev/null || echo "$LOCAL_VER")
            echo "Version $LOCAL_VER is already published on npm (latest is $LATEST_VER)."
            echo "Auto-incrementing patch version..."
            npm version "$LATEST_VER" --no-git-tag-version --allow-same-version
            npm version patch --no-git-tag-version
            NEW_VER=$(node -p "require('./package.json').version")
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing new version $LOCAL_VER directly..."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs via OIDC Trusted Publisher
        run: npm publish --provenance --access public

      - name: Commit and push updated version to GitHub
        if: steps.versioning.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.versioning.outputs.version }} [skip ci]"
          git push origin main
